# Supabase CLI config for the Yogi backend.
# `supabase link --project-ref <ref>` writes the ref into your local state; this
# file keeps function settings and auth providers under version control.

project_id = "yogi"

[api]
enabled = true
schemas = ["public", "storage"]
max_rows = 500

[db]
major_version = 17

[auth]
site_url = "https://yogi.app"
additional_redirect_urls = ["yogi://auth-callback"]
enable_signup = true
# Phone is the only way in. Email is off so nobody lands in a second account
# with the same person behind it.
enable_email_signup = false
enable_email_autoconfirm = false

[auth.sms]
enable_signup = true
enable_confirmations = true
# 6 digits, 10 minute window. Shorter than the default hour: an SMS code that
# stays valid for an hour is a code someone else can still use.
template = "Your Yogi code is {{ .Code }}"
max_frequency = "30s"
otp_length = 6
otp_expiry = 600

# Set the provider secrets with `supabase secrets set`, never in this file.
[auth.sms.twilio]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

# Third-party sign in is deliberately off. Turning any of these on brings App
# Store rule 4.8 into play, which then requires Sign in with Apple as well.
[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[functions.extract]
verify_jwt = true

[functions.ask-yogi]
verify_jwt = true

[functions.reminders-cron]
verify_jwt = false

[storage]
file_size_limit = "25MiB"
