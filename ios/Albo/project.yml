name: Albo
options:
  bundleIdPrefix: com.sourcedai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Browse AppIcon-King AppIcon-Reads AppIcon-Cooks AppIcon-News"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
configFiles:
  Debug: Albo/Resources/Albo.xcconfig
  Release: Albo/Resources/Albo.xcconfig
targets:
  Albo:
    type: application
    platform: iOS
    sources:
      - path: Albo
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: Albo/Resources/Albo.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Albo/Resources/Info.plist
      properties:
        CFBundleDisplayName: Albo
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSUserTrackingUsageDescription: "This allows Albo to provide you with a more personalised experience and measure the effectiveness of our campaigns."
        NSPhotoLibraryUsageDescription: "Albo needs photo access to add profile pictures, review photos and screenshot imports."
        NSCameraUsageDescription: "Albo needs camera access to take profile pictures and scan QR codes."
        NSLocationWhenInUseUsageDescription: "Albo uses your location to show places near you and calculate distances to saved locations."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Albo uses your location in the background to remind you when you're near a saved place."
        NSCalendarsWriteOnlyAccessUsageDescription: "Albo needs calendar access to add events to your calendar."
        NSContactsUsageDescription: "Albo uses your contacts to help you find friends on Albo."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sourcedai.albo
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_STYLE: Automatic
