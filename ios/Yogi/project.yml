name: Yogi
options:
  bundleIdPrefix: com.sourcedai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Browse AppIcon-King AppIcon-Reads AppIcon-Cooks AppIcon-News"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
configFiles:
  Debug: Yogi/Resources/Yogi.xcconfig
  Release: Yogi/Resources/Yogi.xcconfig
targets:
  Yogi:
    type: application
    platform: iOS
    sources:
      - path: Yogi
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: Supabase
        product: Supabase
      - target: YogiShare
        embed: true
    entitlements:
      path: Yogi/Resources/Yogi.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups:
          - group.com.sourcedai.yogi
    info:
      path: Yogi/Resources/Info.plist
      properties:
        CFBundleDisplayName: Yogi
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.sourcedai.yogi
            CFBundleURLSchemes: [yogi]
        NSUserTrackingUsageDescription: "This allows Yogi to provide you with a more personalised experience and measure the effectiveness of our campaigns."
        NSPhotoLibraryUsageDescription: "Yogi needs photo access to add profile pictures, review photos and screenshot imports."
        NSCameraUsageDescription: "Yogi needs camera access to take profile pictures and scan QR codes."
        NSLocationWhenInUseUsageDescription: "Yogi uses your location to show places near you and calculate distances to saved locations."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Yogi uses your location in the background to remind you when you're near a saved place."
        NSCalendarsWriteOnlyAccessUsageDescription: "Yogi needs calendar access to add events to your calendar."
        NSContactsUsageDescription: "Yogi uses your contacts to help you find friends on Yogi."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sourcedai.yogi
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_STYLE: Automatic
  YogiShare:
    type: app-extension
    platform: iOS
    sources:
      # The extension is its own process, so it compiles the handful of dependency-free
      # files it needs rather than linking the whole app.
      - path: YogiShare
        excludes:
          - "Info.plist"
          - "YogiShare.entitlements"
      - path: Yogi/Shared
      - path: Yogi/Models/Models.swift
      - path: Yogi/DesignSystem/YogiColor.swift
      - path: Yogi/DesignSystem/YogiType.swift
      - path: Yogi/DesignSystem/Buttons.swift
      - path: Yogi/DesignSystem/Haptics.swift
    entitlements:
      path: YogiShare/YogiShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sourcedai.yogi
    info:
      path: YogiShare/Info.plist
      properties:
        CFBundleDisplayName: Yogi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sourcedai.yogi.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"

schemes:
  Yogi:
    build:
      targets:
        Yogi: all
        YogiShare: all
    run:
      config: Debug
      storeKitConfiguration: Yogi/Resources/Yogi.storekit
    archive:
      config: Release
  YogiShare:
    # Run this scheme and pick a host app (Safari) to debug the share sheet.
    build:
      targets:
        YogiShare: all
    run:
      config: Debug
